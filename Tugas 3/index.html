<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <main class="card" id="form-card">
            <h1>Formulir Pendaftaran</h1>
            <p class="subtitle">Isi data berikut, lalu kirim untuk melihat halaman detail.</p>

            <form method="GET" action="detail.html">
                <fieldset>
                    <legend>Data diri</legend>

                    <div class="form-group">
                        <label for="nama">Nama lengkap</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Jenis kelamin</label>
                        <div class="inline-options">
                            <label for="laki"><input type="radio" id="laki" name="gender" value="laki-laki" required> Laki-laki</label>
                            <label for="perempuan"><input type="radio" id="perempuan" name="gender" value="perempuan"> Perempuan</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="tgl_lahir">Tanggal lahir</label>
                        <input type="date" id="tgl_lahir" name="tgl_lahir">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Akademik dan minat</legend>

                    <div class="form-group">
                        <label for="prodi">Program studi</label>
                        <select id="prodi" name="prodi">
                            <option value="">Pilih program studi</option>
                            <option value="teknik-informatika">Teknik Informatika</option>
                            <option value="sistem-informasi">Sistem Informasi</option>
                            <option value="sains-data">Sains Data</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Bidang minat</label>
                        <div class="inline-options">
                            <label for="web"><input type="checkbox" id="web" name="minat" value="web"> Web</label>
                            <label for="mobile"><input type="checkbox" id="mobile" name="minat" value="mobile"> Mobile</label>
                            <label for="data"><input type="checkbox" id="data" name="minat" value="data"> Data</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="alasan">Alasan mendaftar</label>
                        <textarea id="alasan" name="alasan" rows="4" placeholder="Tulis alasan singkat"></textarea>
                    </div>
                </fieldset>

                <div class="actions">
                    <button type="reset" class="btn btn-secondary">Reset</button>
                    <button type="submit" class="btn btn-primary">Kirim pendaftaran</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
